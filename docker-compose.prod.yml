# Production на VPS РФ (тот же хост, что studio-book).
# GitHub Actions пушит ghcr.io/valera7623/eyelash-studio и на сервере только pull.
# Порты не пересекаются со studio-book: HTTP 8089, Redis 6380.
#
# network_mode: host — polling к api.telegram.org как у хоста.
name: eyelash-studio

services:
  redis:
    image: redis:7-alpine
    network_mode: host
    command: ["redis-server", "--port", "6380", "--save", "", "--appendonly", "no", "--bind", "127.0.0.1"]
    restart: unless-stopped
  bot:
    image: ${DOCKER_IMAGE:-eyelash-studio:local}
    build: .
    network_mode: host
    env_file:
      - .env
    environment:
      SQLITE_PATH: /app/data/eyelash.db
      USE_REDIS: "true"
      REDIS_URL: redis://127.0.0.1:6380/0
      HTTP_PORT: "8089"
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    pull_policy: missing
    depends_on:
      - redis
