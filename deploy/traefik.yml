# Install: copy to /home/valera/traefik/dynamic/eyelash.yml
# Traefik :80/:443 -> host :8089 (eyelash-studio bot; studio-book occupies :8088)
# www has DNS — include it so phones that auto-open www. work.

http:
  routers:
    eyelash:
      rule: "Host(`eyelash.com.ru`)"
      priority: 1
      entryPoints:
        - websecure
      service: eyelash
      tls:
        certResolver: letsencrypt

    eyelash-www:
      rule: "Host(`www.eyelash.com.ru`)"
      priority: 1
      entryPoints:
        - websecure
      service: eyelash
      tls:
        certResolver: letsencrypt
      middlewares:
        - eyelash-redirect-apex

    eyelash-http:
      rule: "Host(`eyelash.com.ru`) || Host(`www.eyelash.com.ru`)"
      entryPoints:
        - web
      service: eyelash
      middlewares:
        - eyelash-redirect-https

  services:
    eyelash:
      loadBalancer:
        servers:
          - url: "http://172.19.0.1:8089"

  middlewares:
    eyelash-redirect-https:
      redirectScheme:
        scheme: https
        port: "443"
        permanent: true

    eyelash-redirect-apex:
      redirectRegex:
        regex: "^https://www\\.eyelash\\.com\\.ru/(.*)"
        replacement: "https://eyelash.com.ru/${1}"
        permanent: true
